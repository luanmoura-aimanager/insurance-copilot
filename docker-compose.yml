services:
  postgres:
    # pgvector/pgvector:pg16 = o postgres:16 oficial + a extensão `vector` já compilada.
    # Trocar a imagem é o que permite `CREATE EXTENSION vector` na migration.
    image: pgvector/pgvector:pg16
    container_name: insurance-copilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance
      POSTGRES_DB: insurance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance"]
      interval: 5s
      retries: 5
volumes:
  pgdata:
